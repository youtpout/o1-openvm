[package]
name = "mkinput"
version = "0.1.0"
edition = "2021"

[dependencies]
# std build: fixture parsing + host-side assembly of the guest's input.
pickles-verifier = { git = "https://github.com/youtpout/o1js-to-zkvm", branch = "perf/batched-accumulator" }
postcard = { version = "1", features = ["alloc"] }
hex = "0.4"
ark-ec = "0.5"
ark-ff = "0.5"
mina-curves = { git = "https://github.com/youtpout/proof-systems", branch = "openvm-on-sp1-on-master" }
serde_json = "1"
